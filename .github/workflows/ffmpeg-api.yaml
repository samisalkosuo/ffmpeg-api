name: ffmpeg-api container build and push

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.adoc'
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.adoc'
      - '**.md'
  schedule:
    # weekly rebuild to pick up the latest FFmpeg and UBI updates
    - cron: '0 4 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Lint
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          ruff format --check .
      - name: Check openapi.json is up to date
        run: |
          python - <<'EOF'
          import json, sys
          from app.main import app
          current = json.dumps(app.openapi(), indent=2, ensure_ascii=False) + "\n"
          if open("openapi.json", encoding="utf-8").read() != current:
              sys.exit("openapi.json is out of date, regenerate it")
          EOF
      - name: Build and run tests in the container
        run: |
          docker build --target test -t ffmpeg-api-test .
          docker run --rm ffmpeg-api-test

  ffmpeg-api-container-build-and-push:
    needs: test
    # pull requests only run the tests
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/reusable-container-build-and-push.yaml
    with:
      imagename: kazhar/ffmpeg-api
      tagname: ${{ github.ref_name }}
      dockerfile: ./Dockerfile
      directory: .
    secrets: inherit
